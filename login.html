<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login Form</title>
    <style>
        body {
            background-color: rgb(21, 21, 21);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .main {
            width: 90%;
            max-width: 800px;
            height: auto;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            border: solid;
            border-color: aqua;
            border-width: 4px;
            border-radius: 80px;
            box-shadow: 0px 0px 10px aqua;
            padding: 30px;
        }

        .t1 {
            font-size: 40px;
            font-family: cursive;
            font-weight: bold;
            color: white;
            text-shadow: 0px 0px 10px rgb(34, 0, 255);
        }

        .d1 {
            width: 100%;
            max-width: 400px;
            height: 130px;
            background-color: rgb(28, 28, 28);
            border-bottom-left-radius: 50px;
            border-top-right-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: solid;
            border-color: aqua;
            box-shadow: 0px 0px 20px aqua;
            animation-name: animate;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }

        .d1:hover {
            background-color: rgb(0, 0, 0);
            transition: 1s;
            border-radius: 0px;
        }

        .form {
            width: 100%;
            height: auto;
            background-color: black;
            display: flex;
            flex-direction: row;
            align-items: center;
            text-shadow: 0px 0px 10px rgb(55, 0, 255);
            margin-bottom: 20px;
        }

        .t2 {
            width: 200px;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: azure;
        }

        .name {
            width: 100%;
            max-width: 350px;
            height: 30px;
            border: solid;
            border-color: rgb(0, 217, 255);
            border-radius: 8px;
            box-shadow: 0px 0px 4px rgb(0, 26, 255);
            text-shadow: 0px 0px 5px rgb(255, 0, 0);
            margin-left: 10px;
            padding: 5px;
        }

        .b1 {
            width: 120px;
            height: 50px;
            background-color: black;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: solid;
            border-color: aqua;
            text-shadow: 0px 0px 5px rgba(255, 0, 0, 0.49);
            box-shadow: 0px 0px 4px rgb(0, 26, 255);
            margin-top: 20px;
        }

        .b1:hover {
            box-shadow: 0px 0px 10px rgb(255, 255, 255);
        }
        @keyframes animate {
            0%{
        transform: translateX(20px);
        background-color: rgb(239, 255, 254);
        background-color: rgb(0, 0, 0);
            transition: 1s;
            border-bottom-right-radius: 50px;
            border-top-right-radius: 0px;
            border-top-left-radius: 50px;
            border-bottom-left-radius: 0px;
            }
    
    50%{
        transform: translateX(90px);
        background-color: rgb(0, 255, 200);
        background-color: rgb(0, 0, 0);
            
            transition: 1s;
            border-bottom-right-radius: 0px;
            border-top-right-radius: 50px;
            border-top-left-radius: 0px;
            border-bottom-left-radius: 50px;
                }
    100%{
        transform: translateX(20px);
        background-color: rgb(0, 0, 0);
            
            transition: 1s;
            border-bottom-right-radius: 50px;
            border-top-right-radius: 0px;
            border-top-left-radius: 50px;
            border-bottom-left-radius: 0px;
            background-color: black;
    }
}

        /* Media Queries for Responsiveness */
        @media screen and (max-width: 768px) {
            .main {
                width: 90%;
                padding: 20px;
            }

            .t1 {
                font-size: 35px;
            }

            .form {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }

            .t2 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .name {
                width: 100%;
                margin-top: 10px;
                padding: 10px;
            }

            .b1 {
                width: 100%;
                margin-top: 15px;
            }

            .d1 {
                max-width: 300px;
                height: 120px;
                animation-duration: 2.5s; /* Slower animation on smaller screens */
            }
        }

        @media screen and (max-width: 480px) {
            .t1 {
                font-size: 28px;
            }

            .t2 {
                font-size: 16px;
            }

            .name {
                width: 100%;
                padding: 10px;
            }

            .b1 {
                width: 100%;
                height: 45px;
                font-size: 18px;
            }

            .d1 {
                max-width: 250px;
                height: 100px;
                animation-duration: 3s; /* Slower animation for smaller screens */
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="d1">
            <center> <h1 class="t1"> Login Form</h1></center>
        </div>
        <div class="form">
            <p class="t2"> Your Name :</p>
            <input type="text" placeholder="Please Enter Full Name" class="name">
        </div>
        <div class="form">
            <p class="t2"> Your E-mail :</p>
            <input type="text" placeholder="Please Enter Your E-mail" class="name">
        </div>
        <div class="form">
            <p class="t2"> Your Number :</p>
            <input type="text" placeholder="Please Enter Your Number" class="name">
        </div>
        <div class="form">
            <p class="t2"> Your Gender :</p>
            <input type="text" placeholder="Please Enter Your Gender" class="name">
        </div>
        <a href="thanks.html">
            <button class="b1">Submit</button>
        </a>
    </div>
</body>
</html>
