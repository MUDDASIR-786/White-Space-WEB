<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks</title>
    <style>
        body {
            width: 100%;
            background-color: rgb(29, 29, 29);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .d {
            width: 90%;
            max-width: 800px;
            height: 640px;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            border: solid;
            border-radius: 40px;
            border-color: aqua;
            border-width: 4px;
            box-shadow: 0px 0px 10px rgb(0, 255, 242);
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: white;
            text-shadow: 0px 0px 20px blue;
            animation-name: animate;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            padding: 20px;
        }

        .b1 {
            width: 120px;
            height: 50px;
            background-color: black;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: solid;
            border-color: aqua;
            text-shadow: 0px 0px 5px rgba(255, 0, 0, 0.49);
            box-shadow: 0px 0px 04px rgb(0, 26, 255);
        }

        .b1:hover {
            box-shadow: 0px 0px 10px rgb(255, 255, 255);
        }

        /* Media Queries for Responsiveness */
        @media screen and (max-width: 768px) {
            .d {
                height: 500px;
                font-size: 24px;
                padding: 15px;
            }

            .b1 {
                width: 100px;
                height: 45px;
                font-size: 18px;
            }
        }

        @media screen and (max-width: 480px) {
            .d {
                height: 400px;
                font-size: 18px;
                padding: 10px;
            }

            .b1 {
                width: 80px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="d">
        <center><h1>Thanks <br> For Login</h1></center>
        <a href="index.html">
            <button class="b1">Back</button>
        </a>
    </div>
</body>
</html>
